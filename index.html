<script>

// ── NAVIGATION ──────────────────────────────────
function go(id){
  document.querySelectorAll('.sc').forEach(function(s){s.classList.remove('on');s.style.display='';});
  var el=document.getElementById(id);

}
function bnav(tab){

// ── UTILS ──────────────────────────────────────
function toast(msg,d){d=d||2200;var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},d);}
function genCode(){return Math.random().toString(36).substring(2,6).toUpperCase();}
function rnd(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}return a;}
function mkOpts(q){return rnd([q.a,q.w[0],q.w[1],q.w[2]]);}
function mkCatGrid(elId,sel,cls,max,cb){
  var el=document.getElementById(elId);if(!el)return;el.innerHTML='';
  var dlbl=document.createElement('div');
  dlbl.style.cssText='width:100%;font-family:var(--fm);font-size:.55rem;color:var(--c1);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;margin-top:2px';

    if(!CATS[n])return;
    var chip=document.createElement('div');
    chip.className='chip'+(sel.indexOf(n)>-1?' '+cls:'');
    chip.textContent=CATS[n]+' '+n;
    chip.onclick=function(){var idx=sel.indexOf(n);if(idx>-1){sel.splice(idx,1);chip.className='chip';}else{if(sel.length>=max){toast('Max '+max+' categories!');return;}sel.push(n);chip.className='chip '+cls;}if(cb)cb();};
    drow.appendChild(chip);
  });
  el.appendChild(drow);
  var mlbl=document.createElement('div');
  mlbl.style.cssText='width:100%;font-family:var(--fm);font-size:.55rem;color:#ff9500;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px';
  mlbl.textContent='🩺 Medical';el.appendChild(mlbl);
  var mrow=document.createElement('div');
  mrow.style.cssText='display:flex;flex-wrap:wrap;gap:7px;width:100%';
  MEDICAL_CATS.forEach(function(n){
    if(!CATS[n])return;
    var chip=document.createElement('div');
    chip.className=sel.indexOf(n)>-1?'chip-med-on':'chip-med';
    chip.textContent=CATS[n]+' '+n;
    chip.onclick=function(){var idx=sel.indexOf(n);if(idx>-1){sel.splice(idx,1);chip.className='chip-med';}else{if(sel.length>=max){toast('Max '+max+' categories!');return;}sel.push(n);chip.className='chip-med-on';}if(cb)cb();};
    mrow.appendChild(chip);
  });
  el.appendChild(mrow);
}

// ── ONLINE BATTLE ──────────────────────────────
var O={isHost:false,code:null,role:null,name:null,qCount:12,sc:[],qs:[],qi:0,scores:{host:0,guest:0},timer:null,tLeft:0,myDone:false,oppDone:false,hName:'',gName:'',subs:[]};
function updOCI(){var n=O.sc.length,el=document.getElementById('cn-ci'),btn=document.getElementById('cn-btn');if(n===4){el.className='ci cok';el.textContent='✅ 4 selected!';btn.disabled=false;}else{el.className='ci cbad';el.textContent='Select 4 ('+n+'/4)';btn.disabled=true;}}
function selQ(el){document.querySelectorAll('.qb').forEach(function(e){e.classList.remove('on');});el.classList.add('on');O.qCount=parseInt(el.dataset.v);}
function createRoom(){
  if(!window._fbReady){toast('Firebase not ready!');return;}
  var name=document.getElementById('cn-name').value.trim();
  if(!name){toast('Enter team name!');return;}
  if(O.sc.length!==4){toast('Select exactly 4!');return;}
  var pool=QB.filter(function(q){return O.sc.indexOf(q.c)>-1;});
  if(pool.length<O.qCount){toast('Not enough questions!');return;}
  var qs=rnd(pool).slice(0,O.qCount).map(function(q){return{c:q.c,q:q.q,a:q.a,opts:mkOpts(q)};});
  var code=genCode();O.code=code;O.isHost=true;O.role='host';O.name=name;O.hName=name;O.qs=qs;
  window._set(window._ref(window._db,'rooms/'+code),{host:name,guest:null,status:'waiting',qCount:O.qCount,qs:qs,qi:0,scores:{host:0,guest:0},answers:{},created:Date.now()}).then(function(){showLobby(code);listenRoom(code);});
}
function joinRoom(){
  if(!window._fbReady){toast('Firebase not ready!');return;}
  var name=document.getElementById('jn-name').value.trim(),code=document.getElementById('jn-code').value.trim().toUpperCase();
  if(!name){toast('Enter name!');return;}if(!code){toast('Enter code!');return;}
  window._get(window._ref(window._db,'rooms/'+code)).then(function(snap){
    if(!snap.exists()){toast('Room not found!');return;}
    var d=snap.val();if(d.status!=='waiting'){toast('Game started!');return;}if(d.guest){toast('Room full!');return;}
    O.code=code;O.isHost=false;O.role='guest';O.name=name;O.hName=d.host;O.gName=name;O.qCount=d.qCount;O.qs=d.qs;
    window._update(window._ref(window._db,'rooms/'+code),{guest:name}).then(function(){showLobby(code);listenRoom(code);});
  });
}
function showLobby(code){go('sc-lobby');document.getElementById('lb-code').textContent=code;document.getElementById('lb-h').textContent=O.hName;if(O.role==='guest'){document.getElementById('lb-g').textContent=O.name;document.getElementById('lb-gs').classList.add('on');}}
function listenRoom(code){
  var u=window._onValue(window._ref(window._db,'rooms/'+code),function(snap){
    if(!snap.exists())return;var d=snap.val();
    if(d.guest&&d.guest!==O.gName){document.getElementById('lb-g').textContent=d.guest;document.getElementById('lb-gs').classList.add('on');document.getElementById('lb-wait').style.display='none';O.gName=d.guest;if(O.isHost){document.getElementById('lb-start').style.display='block';}}
    if(d.status==='playing'){O.qs=d.qs;O.scores=d.scores||{host:0,guest:0};if(!document.getElementById('sc-game').classList.contains('on')){showGameSc(d);}}
    if(d.status==='finished'){showOnlineEnd(d);return;}
    if(d.status==='playing'&&d.answers&&d.answers[O.qi]){var opp=O.role==='host'?'guest':'host';if(d.answers[O.qi][opp]&&!O.oppDone){O.oppDone=true;if(O.myDone)evalRound();}}
  });O.subs.push(u);
}
function startOnline(){window._update(window._ref(window._db,'rooms/'+O.code),{status:'playing',qi:0});}
function leaveRoom(){O.subs.forEach(function(u){if(u)u();});O.subs=[];go('sc-land');resetOnline();}
function showGameSc(d){go('sc-game');O.scores=d.scores||{host:0,guest:0};document.getElementById('g-n1').textContent=d.host;document.getElementById('g-n2').textContent=d.guest||'Guest';document.getElementById('g-s1').textContent=O.scores.host||0;document.getElementById('g-s2').textContent=O.scores.guest||0;loadQ(d.qi||0);}
function loadQ(idx){O.qi=idx;O.myDone=false;O.oppDone=false;var q=O.qs[idx];if(!q)return;document.getElementById('g-qi').textContent=idx+1;document.getElementById('g-qt').textContent=O.qs.length;document.getElementById('g-cat').textContent=(CATS[q.c]||'')+' '+q.c;document.getElementById('g-q').textContent=q.q;var opts=q.opts||mkOpts(q);document.getElementById('g-opts').innerHTML=opts.map(function(o,i){return'<button class="mo" onclick="pickOpt(this,\''+encodeURIComponent(o)+'\',\''+encodeURIComponent(q.a)+'\')"><span class="ol">'+'ABCD'[i]+'</span>'+o+'</button>';}).join('');document.getElementById('g-wait').style.display='none';document.getElementById('rovl').classList.remove('on');clearInterval(O.timer);startTimer(10);}
function startTimer(secs){clearInterval(O.timer);O.tLeft=secs;var C=2*Math.PI*28;function upd(){document.getElementById('tnum').textContent=O.tLeft;var p=O.tLeft/secs;var pg=document.getElementById('tpg');pg.style.strokeDasharray=C;pg.style.strokeDashoffset=C*(1-p);pg.className='tpg'+(p<=0.25?' dng':p<=0.5?' warn':'');}upd();O.timer=setInterval(function(){O.tLeft--;upd();if(O.tLeft<=0){clearInterval(O.timer);if(!O.myDone)submitAns('__t__',false);}},1000);}
function pickOpt(btn,oEnc,aEnc){if(O.myDone)return;var o=decodeURIComponent(oEnc),a=decodeURIComponent(aEnc);document.querySelectorAll('#g-opts .mo').forEach(function(b){b.disabled=true;});clearInterval(O.timer);submitAns(o,o===a);}
function submitAns(txt,correct){if(O.myDone)return;O.myDone=true;document.querySelectorAll('#g-opts .mo').forEach(function(b){b.disabled=true;});document.getElementById('g-wait').style.display='flex';window._set(window._ref(window._db,'rooms/'+O.code+'/answers/'+O.qi+'/'+O.role),{txt:txt,correct:correct,time:10-O.tLeft}).then(function(){window._get(window._ref(window._db,'rooms/'+O.code+'/answers/'+O.qi)).then(function(snap){if(snap.exists()){var opp=O.role==='host'?'guest':'host';if(snap.val()[opp])O.oppDone=true;}if(O.myDone&&O.oppDone)evalRound();});});}
function evalRound(){window._get(window._ref(window._db,'rooms/'+O.code)).then(function(snap){if(!snap.exists())return;var d=snap.val();var q=O.qs[O.qi];var opts=q.opts||mkOpts(q);document.querySelectorAll('#g-opts .mo').forEach(function(btn,i){if(opts[i]===q.a)btn.classList.add('ok');else if(btn.classList.contains('picked'))btn.classList.add('bad');});var myD=d.answers&&d.answers[O.qi]&&d.answers[O.qi][O.role];if(O.isHost){var ns={host:(d.scores?d.scores.host||0:0),guest:(d.scores?d.scores.guest||0:0)};var hd=d.answers&&d.answers[O.qi]&&d.answers[O.qi].host,gd=d.answers&&d.answers[O.qi]&&d.answers[O.qi].guest;var hp=0,gp=0;if(hd&&hd.correct)hp=10;if(gd&&gd.correct)gp=10;ns.host+=hp;ns.guest+=gp;var nxi=O.qi+1,done=nxi>=O.qs.length;setTimeout(function(){window._update(window._ref(window._db,'rooms/'+O.code),{scores:ns,qi:nxi,status:done?'finished':'playing'});},3500);}var sc=d.scores||{host:0,guest:0};showROvl(myD&&myD.correct,q.a,O.role==='host'?sc.host:sc.guest,O.role==='host'?sc.guest:sc.host);});}
function showROvl(correct,ans,my,opp){document.getElementById('r-emj').textContent=correct?'✅':'❌';document.getElementById('r-vrd').textContent=correct?'Correct! 🎉':'Wrong!';document.getElementById('r-vrd').className='rvrd '+(correct?'ok':'bad');document.getElementById('r-ans').textContent=' '+ans;document.getElementById('r-ms').textContent=my;document.getElementById('r-os').textContent=opp;document.getElementById('rovl').classList.add('on');var c=3;var t=setInterval(function(){c--;document.getElementById('r-nxt').textContent='Next in '+c+'...';if(c<=0){clearInterval(t);document.getElementById('rovl').classList.remove('on');}},1000);}
function showOnlineEnd(d){clearInterval(O.timer);document.getElementById('rovl').classList.remove('on');go('sc-results');var hs=d.scores?d.scores.host||0:0,gs=d.scores?d.scores.guest||0:0;var w=hs>gs?d.host:gs>hs?(d.guest||'Guest'):'🤝 Tie!';document.getElementById('f-win').textContent=w;document.getElementById('f-wsc').textContent=hs===gs?'Equal!':'Score: '+Math.max(hs,gs);document.getElementById('f-n1').textContent=d.host;document.getElementById('f-n2').textContent=d.guest||'Guest';document.getElementById('f-s1').textContent=hs;document.getElementById('f-s2').textContent=gs;}
function resetOnline(){O.subs.forEach(function(u){if(u)u();});O.subs=[];clearInterval(O.timer);O.code=null;O.isHost=false;O.role=null;O.qi=0;O.scores={host:0,guest:0};O.myDone=false;O.oppDone=false;O.sc=[];}

var L={t1:'',t2:'',s:{t1:0,t2:0},sc:[],board:{},curQ:null,timer:null,secs:0,awarded:false,ansRevealed:false};
function updLCI(){var n=L.sc.length,el=document.getElementById('lc-ci'),btn=document.getElementById('lc-btn');if(n===6){el.className='ci cok';el.textContent='✅ 6 selected!';btn.disabled=false;}else{el.className='ci cbad';el.textContent='Select 6 ('+n+'/6)';btn.disabled=true;}}

function dcInfo(){var EPOCH=new Date('2024-01-01T00:00:00Z').getTime(),now=Date.now(),dayMs=86400000;var days=Math.floor((now-EPOCH)/dayMs);var cycleDay=(days%10)+1,cn=Math.floor(days/10),key='day_'+days;var msLeft=Math.ceil(now/dayMs)*dayMs-now;return{cycleDay:cycleDay,cn:cn,key:key,resetIn:Math.floor(msLeft/3600000)+'h '+Math.floor((msLeft%3600000)/60000)+'m',days10:days};}
function dcGetQs(key){var seed=0;for(var i=0;i<key.length;i++)seed=(seed*31+key.charCodeAt(i))&0xffffffff;function sr(s){s=Math.sin(s)*10000;return s-Math.floor(s);}var dentalQB=QB.filter(function(q){return DENTAL_CATS.indexOf(q.c)>-1;});var idx=dentalQB.map(function(_,i){return i;});for(var i=idx.length-1;i>0;i--){var j=Math.floor(sr(seed+i)*(i+1));var tmp=idx[i];idx[i]=idx[j];idx[j]=tmp;}return idx.slice(0,60).map(function(i){return{c:dentalQB[i].c,q:dentalQB[i].q,a:dentalQB[i].a,opts:mkOpts(dentalQB[i])};});}

function dcEnd(){DC.done=true;clearInterval(DC.timer);document.getElementById('sc-daily-game').style.display='none';if(!window._cu||!window._fbReady||!window._db){dcShowRes(DC.score,DC.score,'-');return;}var uid=window._cu.uid,uName=window._cu.displayName||window._cu.email.split('@')[0];var info=dcInfo();var cycleTotal=DC.score;var myRank='-';window._get(window._ref(window._db,'daily/'+info.cn+'/scores/'+uid)).then(function(snap){var ex=snap.exists()?snap.val():{};ex[info.key]=DC.score;var total=0;Object.keys(ex).forEach(function(k){total+=ex[k];});cycleTotal=total;return window._set(window._ref(window._db,'daily/'+info.cn+'/scores/'+uid),ex);}).then(function(){return window._set(window._ref(window._db,'daily/'+info.cn+'/leaderboard/'+uid),{name:uName,uid:uid,cycleTotal:cycleTotal,lastUpdated:Date.now()});}).then(function(){return window._get(window._ref(window._db,'daily/'+info.cn+'/leaderboard'));}).then(function(lbSnap){if(lbSnap.exists()){var all=Object.values(lbSnap.val()).sort(function(a,b){return b.cycleTotal-a.cycleTotal;});for(var i=0;i<all.length;i++){if(all[i].uid===uid||all[i].name===uName){myRank='#'+(i+1);break;}}}dcShowRes(DC.score,cycleTotal,myRank);window.dcUpdateHome&&window.dcUpdateHome();window.loadLandingLB&&window.loadLandingLB();}).catch(function(){dcShowRes(DC.score,cycleTotal,myRank);});}
function dcShowRes(todayScore,cycleTotal,myRank){document.getElementById('dc-remj').textContent=todayScore>=15?'🏆':todayScore>=8?'🎯':todayScore>=3?'💪':'😅';document.getElementById('dc-rs').textContent=todayScore;document.getElementById('dc-rt').textContent=cycleTotal;document.getElementById('dc-rr').textContent=myRank;var rl=document.getElementById('dc-rl');if(rl){if(myRank==='#1')rl.textContent='🥇 First place!';else if(myRank==='#2')rl.textContent='🥈 Second place!';else if(myRank==='#3')rl.textContent='🥉 Third place!';else rl.textContent='Keep playing daily to climb up!';}go('sc-daily-results');}
window.dcLoadLB=function(){var lbBody=document.getElementById('lb-body'),lbCI=document.getElementById('lb-ci'),info=dcInfo();if(lbCI){var dLeft=10-info.cycleDay;lbCI.textContent='Day '+info.cycleDay+'/10 · '+dLeft+' day'+(dLeft!==1?'s':'')+' left';}if(!window._fbReady||!window._db){if(lbBody)lbBody.innerHTML='<div style="text-align:center;padding:20px;font-family:var(--fm);font-size:.68rem;color:var(--mt)">Firebase not ready</div>';return;}if(lbBody)lbBody.innerHTML='<div class="pulse"><div class="d"></div><div class="d"></div><div class="d"></div><span>Loading...</span></div>';window._get(window._ref(window._db,'daily/'+info.cn+'/leaderboard')).then(function(snap){if(!snap.exists()){lbBody.innerHTML='<div style="text-align:center;padding:40px"><div style="font-size:2rem;margin-bottom:10px">🏆</div><div style="font-family:var(--fm);font-size:.7rem;color:var(--mt)">No scores yet!</div></div>';return;}var players=Object.values(snap.val()).sort(function(a,b){return b.cycleTotal-a.cycleTotal;});var myUid=window._cu?window._cu.uid:'',myName=window._cu?(window._cu.displayName||window._cu.email.split('@')[0]):'';var medals=['🥇','🥈','🥉'],colors=['var(--c3)','var(--c4)','var(--c5)'];var summaryHtml='<div style="background:var(--s2);border:1px solid var(--b1);border-radius:12px;padding:13px;text-align:center;margin-bottom:12px"><div style="font-family:var(--fm);font-size:.58rem;color:var(--mt);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">Points accumulate over 10 days</div><div style="display:flex;justify-content:center;gap:18px"><div style="text-align:center"><div style="font-size:1.3rem;font-weight:800;color:var(--pk)">'+info.cycleDay+'</div><div style="font-family:var(--fm);font-size:.56rem;color:var(--mt)">Day</div></div><div style="text-align:center"><div style="font-size:1.3rem;font-weight:800;color:var(--c3)">'+players.length+'</div><div style="font-family:var(--fm);font-size:.56rem;color:var(--mt)">Players</div></div></div></div>';var rowsHtml=players.map(function(p,i){var isMe=(p.uid&&p.uid===myUid)||(p.name===myName);var c=colors[i]||'var(--tx)';return'<div class="lbrow'+(isMe?' me':'')+'"><div class="lbrk" style="color:'+c+'">'+(medals[i]||i+1)+'</div><div class="lbnm">'+p.name+(isMe?' 👈':'')+'</div><div class="lbsc"><span>'+p.cycleTotal+'</span>cycle pts</div></div>';}).join('');lbBody.innerHTML=summaryHtml+rowsHtml;}).catch(function(){lbBody.innerHTML='<div style="text-align:center;padding:20px;font-family:var(--fm);font-size:.68rem;color:var(--mt)">Error loading</div>';});};
window.loadLandingLB=function(){var el=document.getElementById('lb-prev-rows'),cycleEl=document.getElementById('lb-prev-cycle');var info=dcInfo();if(cycleEl)cycleEl.textContent='Day '+info.cycleDay+'/10';if(!window._fbReady||!window._db||!el){if(el)el.innerHTML='<div style="padding:12px;text-align:center;font-family:var(--fm);font-size:.65rem;color:var(--mt)">Sign in to see rankings</div>';return;}window._get(window._ref(window._db,'daily/'+info.cn+'/leaderboard')).then(function(snap){if(!snap.exists()){el.innerHTML='<div style="padding:14px;text-align:center;font-family:var(--fm);font-size:.65rem;color:var(--mt)">No scores yet</div>';return;}var players=Object.values(snap.val()).sort(function(a,b){return b.cycleTotal-a.cycleTotal;}).slice(0,3);var myUid=window._cu?window._cu.uid:'',myName=window._cu?(window._cu.displayName||window._cu.email.split('@')[0]):'';var medals=['🥇','🥈','🥉'];el.innerHTML=players.map(function(p,i){var isMe=(p.uid&&p.uid===myUid)||(p.name===myName);return'<div class="lb-r'+(isMe?' me':'')+'"><div class="lb-rk">'+medals[i]+'</div><div class="lb-nm">'+p.name+(isMe?' 👈':'')+'</div><div class="lb-sc"><div class="p">'+p.cycleTotal+'</div><div class="l">pts</div></div></div>';}).join('');}).catch(function(){});};

// ── STUDY SMART (EXAM) ──────────────────────────
var EX={subj:null,ci:0,qi:0,rev:{},folderStack:[],curFolder:null};
function exKey(s,c,q){return s+'-'+c+'-'+q;}
function exLoad(){try{EX.rev=JSON.parse(localStorage.getItem('ex_rev')||'{}');}catch(e){EX.rev={};}}
function exSave(){localStorage.setItem('ex_rev',JSON.stringify(EX.rev));}
function exCountDone(subj){if(!subj||subj.isFolder||subj.isExternal)return{done:0,tot:0};var tot=0,done=0;(subj.chapters||[]).forEach(function(ch,ci){tot+=ch.questions.length;ch.questions.forEach(function(_,qi){if(EX.rev[exKey(subj.id,ci,qi)])done++;});});return{done:done,tot:tot};}
function exCountFolder(items){var done=0,tot=0;(items||[]).forEach(function(s){if(s.isFolder){var r=exCountFolder(s.children||[]);done+=r.done;tot+=r.tot;}else if(!s.isExternal){var r=exCountDone(s);done+=r.done;tot+=r.tot;}});return{done:done,tot:tot};}
function exRenderHome(){var el=document.getElementById('exam-sl');if(!el)return;EX.folderStack=[];EX.curFolder=null;el.innerHTML=exBuildList(EXAM_SUBJECTS);exBindClicks(el);var bb=document.getElementById('ex-back-btn');if(bb)bb.style.display='none';var sub=document.getElementById('ex-study-sub');if(sub)sub.textContent='📚 اختر التخصص وابدأ المراجعة';}
function exBuildList(items){return items.map(function(s){var isMed=s.isMedical||false;var bdr=isMed?'rgba(255,149,0,.25)':s.id==='kbr-entry'?'rgba(240,201,77,.25)':s.isFolder?'rgba(176,110,255,.2)':'rgba(170,255,0,.15)';var col=isMed?'#ff9500':s.id==='kbr-entry'?'#f0c94d':s.isFolder?'var(--c5)':'var(--c3)';var prog='';if(s.isFolder){var r=exCountFolder(s.children||[]);prog=r.tot>0?(r.done+'/'+r.tot):'sub-folders';}else if(s.isExternal){prog='tap to open';}else{var r=exCountDone(s);prog=r.done+'/'+r.tot+' done';}var arrow=s.isFolder?'<b style="color:'+col+'">&#9656;</b>':s.isExternal?'<b style="color:'+col+'">&#8599;</b>':'<b style="color:var(--mt)">&#10095;</b>';var medTag=isMed?'<span style="font-family:var(--fm);font-size:.48rem;background:rgba(255,149,0,.12);border:1px solid rgba(255,149,0,.3);color:#ff9500;padding:1px 5px;border-radius:4px;margin-left:4px;vertical-align:middle">Medical</span>':'';return'<div class="ex-item" data-sid="'+s.id+'" style="background:var(--s2);border:1px solid '+bdr+';border-radius:13px;padding:14px 16px;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:space-between;gap:11px;margin-bottom:8px"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:1.4rem">'+s.icon+'</span><div><div style="font-size:.88rem;font-weight:700;margin-bottom:2px;color:'+col+'">'+s.name+medTag+'</div><div style="font-family:var(--fm);font-size:.58rem;color:var(--mt)">'+s.desc+' &middot; '+prog+'</div></div></div>'+arrow+'</div>';}).join('');}
function exBindClicks(container){if(!container)return;container.querySelectorAll('.ex-item').forEach(function(div){var sid=div.getAttribute('data-sid');div.onclick=function(){exSelectItem(sid);};});}
function exSelectItem(id){var s=exFindItem(EXAM_SUBJECTS,id);if(!s)return;if(s.isExternal){window.location.href=s.externalUrl;return;}if(s.isFolder){var parent=EX.curFolder||{id:'root',children:EXAM_SUBJECTS,name:'Study Smart'};EX.folderStack.push(parent);EX.curFolder=s;exShowFolder(s);return;}EX.subj=s;go('sc-exam-subject');exRenderSubj();}
function exFindItem(items,id){for(var i=0;i<(items||[]).length;i++){if(items[i].id===id)return items[i];if(items[i].isFolder){var f=exFindItem(items[i].children,id);if(f)return f;}}return null;}
function exShowFolder(folder){var el=document.getElementById('exam-sl');if(!el)return;go('sc-exam-home');el.innerHTML=exBuildList(folder.children||[]);exBindClicks(el);var sub=document.getElementById('ex-study-sub');if(sub)sub.textContent=folder.name;var bb=document.getElementById('ex-back-btn');if(bb)bb.style.display='block';}
function exGoBack(){if(EX.folderStack.length===0){exRenderHome();return;}var prev=EX.folderStack.pop();if(!prev||prev.id==='root'){EX.curFolder=null;exRenderHome();}else{EX.curFolder=prev;exShowFolder(prev);}}
function exRenderSubj(){if(!EX.subj)return;var s=EX.subj;document.getElementById('ex-st').textContent=s.name;var tot=0,done=0;(s.chapters||[]).forEach(function(ch,ci){tot+=ch.questions.length;ch.questions.forEach(function(_,qi){if(EX.rev[exKey(s.id,ci,qi)])done++;});});document.getElementById('ex-ss').textContent=(s.chapters||[]).length+' chapters / '+tot+' questions';document.getElementById('ex-pf').style.width=(tot>0?(done/tot*100):0)+'%';document.getElementById('ex-pl').textContent=done+' / '+tot+' reviewed';var el=document.getElementById('ex-cl');el.innerHTML=(s.chapters||[]).map(function(ch,ci){var chDone=ch.questions.filter(function(_,qi){return EX.rev[exKey(s.id,ci,qi)];}).length;var items=ch.questions.map(function(q,qi){var isDone=!!EX.rev[exKey(s.id,ci,qi)];return'<div onclick="exGoCard('+ci+','+qi+')" style="background:var(--s2);border:1px solid '+(isDone?'rgba(61,220,132,.28)':'var(--b1)')+(isDone?';background:rgba(61,220,132,.03)':'')+';border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:5px"><span style="font-size:.8rem;font-weight:600;flex:1;line-height:1.4">'+q.q+'</span><span>'+(isDone?'✅':'›')+'</span></div>';}).join('');return'<div style="margin-bottom:18px"><div style="font-family:var(--fm);font-size:.6rem;color:'+(ch.color||'var(--c5)')+';letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--b1)">'+ch.title+' ('+chDone+'/'+ch.questions.length+')</div>'+items+'</div>';}).join('');}
function exGoCard(ci,qi){EX.ci=ci;EX.qi=qi;go('sc-exam-card');exRenderCard();}
function exRenderCard(){if(!EX.subj)return;var ch=EX.subj.chapters[EX.ci],q=ch.questions[EX.qi];var key=exKey(EX.subj.id,EX.ci,EX.qi),isDone=!!EX.rev[key];document.getElementById('ex-cc').textContent=ch.title;document.getElementById('ex-cnt').textContent=(EX.qi+1)+'/'+ch.questions.length;document.getElementById('ex-q').textContent=q.q;document.getElementById('ex-a').innerHTML=q.a;document.getElementById('ex-ab').style.display='none';document.getElementById('ex-sb').style.display='block';var mb=document.getElementById('ex-mb');mb.textContent=isDone?'✅ Reviewed':'☑ Mark as reviewed';mb.style.color=isDone?'var(--c3)':'var(--mt)';mb.style.borderColor=isDone?'rgba(170,255,0,.35)':'var(--b2)';var nb=document.getElementById('ex-nb');if(EX.qi>=ch.questions.length-1){nb.textContent='Finish ✓';nb.style.background='var(--c3)';nb.style.color='var(--bg)';}else{nb.textContent='Next →';nb.style.background='var(--c5)';nb.style.color='#fff';}}
function exShowAns(){document.getElementById('ex-ab').style.display='block';document.getElementById('ex-sb').style.display='none';}
function exNext(){var ch=EX.subj.chapters[EX.ci];if(EX.qi<ch.questions.length-1){EX.qi++;exRenderCard();}else{var r=exCountDone(EX.subj);document.getElementById('ex-dn').textContent=r.done;document.getElementById('ex-dt').textContent=r.tot;go('sc-exam-done');}}
function exPrev(){if(EX.qi>0){EX.qi--;exRenderCard();}}
function exToggleMark(){var key=exKey(EX.subj.id,EX.ci,EX.qi);EX.rev[key]=!EX.rev[key];exSave();exRenderCard();}

exLoad();
window.go=go;window.bnav=bnav;window.toast=toast;window.setTrack=setTrack;
window.updOCI=updOCI;window.updLCI=updLCI;window.updGCI=updGCI;window.selQ=selQ;
window.createRoom=createRoom;window.joinRoom=joinRoom;window.startOnline=startOnline;window.leaveRoom=leaveRoom;window.pickOpt=pickOpt;
window.startLocal=startLocal;window.openLQ=openLQ;window.showLocalOpts=showLocalOpts;window.revealLocalAns=revealLocalAns;window.awardPts=awardPts;window.closeLocalQ=closeLocalQ;window.showLRes=showLRes;
window.createGFRoom=createGFRoom;window.joinGFRoom=joinGFRoom;window.startGFGame=startGFGame;window.gfAns=gfAns;window.playAgainGF=playAgainGF;window.leaveGFRoom=leaveGFRoom;
window.startDC=startDC;window.dcAns=dcAns;
window.exRenderHome=exRenderHome;window.exRenderSubj=exRenderSubj;window.exGoCard=exGoCard;window.exGoBack=exGoBack;window.exShowAns=exShowAns;window.exNext=exNext;window.exPrev=exPrev;window.exToggleMark=exToggleMark;

document.addEventListener('DOMContentLoaded',function(){
  var nav=document.getElementById('bnav');if(nav)nav.style.display='flex';
  var ub=document.getElementById('ub');if(ub)ub.style.display='flex';
  exRenderHome();
  window.updateDCLandCard&&window.updateDCLandCard();
});
